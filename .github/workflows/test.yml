name: Test fipiran scraper

on:
 schedule:
  - cron: "00 11 * * *"
 workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests jdatetime

      - name: Run scraper
        run: python fipiran.py
